<style>

<body>

<div class="header">
  <h1>图片加密解密工具</h1>

      <option value="6">6-逐列迂回</option>

  </div>
  <div class="param-group">
    <label>输出起点</label>
    <select id="outputStart">
      <option value="1">1-左上角</option>
      <option value="2">2-右上角</option>
      <option value="3">3-右下角</option>
      <option value="4">4-左下角</option>

    <label>输出顺序</label>

        <p>加密后的图片将在此显示</p>
        <small>也可点击加载已加密的PNG图片进行解密</small>
      </div>

      <div class="progress-overlay hidden" id="rightProgress">

      </div>
    </div>
    <div class="img-info" id="rightInfo">尚未生成加密图片</div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// 数学常数数字序列
// ============================================================
const PI_STR = "31415926535897932384626433832795028841971693993751058209749445923078164062862089986280348253421170679821480865132823066470938446095505822317253594081284811174502841027019385211055596446229489549303819644288109756659334461284756482337867831652712019091456485669234603486104543266482133936072602491412737245870066063155881748815209209628292540917153643678925903600113305305488204665213841469519415116094330572703657595919530921861173819326117931051185480744623799627495673518857527248912279381830119491298336733624406566430860213949463952247371907021798609437027705392171762931767523846748184676694051320005681271452635608277857713427577896091736371787214684409012249534301465495853710507922796892589235420199561121290219608640344181598136297747713099605187072113499999983729780499510597317328160963185950244594553469083026425223082533446850352619311881710100031378387528865875332083814206171776691473035982534904287554687311595628638823537875937519577818577805321712268066130019278766111959092164201989";
const E_STR = "27182818284590452353602874713526624977572470936999595749669676277240766303535475945713821785251664274274663919320030599218174135966290435729003342952605956307381323286279434907632338298807531952510190115738341879307021540891499348841675092447614606680822648001684774118537423454424371075390777449920695517027618386062613313845830007520449338265602976067371132007093287091442553582691576399375302072040743213594087563251234296132961894462457247438561880445769630679270072276405467759647093872530906336608532711448493443697063952644568676269745549822806782528266438782954046415436105803756164013477106384590947807934644094798998894859901944062711346569671032072257383793019283843818071506015579936905474498199212239321891764354912586653381684267363683673359554973686851407215420885251681391627212854090068750578845309683916820843214660266544";
const PHI_STR = "161803398874989484820458683436563811772030917980576286213544862270526046281890244970720720418939113748475408807538689175212663386222353693179318006076672635443338908659593958290563832266131992829026788067520876689250171116962070322210432162695486262963136144381497587012203408058879544547492461856953648006440972011691714755431680753379565646592729587090107673247510741673617640731293407408296936078955861548425264522401764325034820647665809286209127349630339344686862540150116922082618572844938463656586982296368511602048587293667540903645362940044987587632645103416303006747457723187594650454360648040645745132911402786653489893713905471740320470398653232941549170640553086434286647525565674790929578230448974008728785964966930313907531866569468354269564876994036406534155194284246567126219867160221230505464597264377154296020470074412500231758439575295710920916368151602445157948874718";

function getDigitSequence(key, count) {
  let str;
  if (key === 'pi') str = PI_STR;
  else if (key === 'e') str = E_STR;
  else if (key === 'phi') str = PHI_STR;
  else str = key;
  
  const needed = Math.max(count * 3, 1000);
  let digits = [];
  for (let i = 0; i < str.length && digits.length < needed; i++) {
    const ch = str[i];
    if (ch >= '0' && ch <= '9') digits.push(parseInt(ch));
  }
  return digits;
}

// ============================================================
// 遍历顺序生成函数
// ============================================================
function spiralCW(rows, cols, start) {
  let result = [];
  let top = 0, bottom = rows - 1, left = 0, right = cols - 1;
  while (top <= bottom && left <= right) {
    for (let c = left; c <= right; c++) result.push([top, c]);
    top++;
    for (let r = top; r <= bottom; r++) result.push([r, right]);
    right--;
    if (top <= bottom) { for (let c = right; c >= left; c--) result.push([bottom, c]); bottom--; }
    if (left <= right) { for (let r = bottom; r >= top; r--) result.push([r, left]); left++; }
  }
  return transformCells(result, rows, cols, start);
}

function spiralCCW(rows, cols, start) {
  let result = [];
  let top = 0, bottom = rows - 1, left = 0, right = cols - 1;
  while (top <= bottom && left <= right) {
    for (let c = right; c >= left; c--) result.push([top, c]);
    top++;
    for (let r = top; r <= bottom; r++) result.push([r, left]);
    left++;
    if (top <= bottom) { for (let c = left; c <= right; c++) result.push([bottom, c]); bottom--; }
    if (left <= right) { for (let r = bottom; r >= top; r--) result.push([r, right]); right--; }
  }
  return transformCells(result, rows, cols, start);
}

function transformCells(cells, rows, cols, start) {
  if (start === 1) return cells;
  if (start === 2) return cells.map(([r, c]) => [r, cols - 1 - c]);
  if (start === 3) return cells.map(([r, c]) => [rows - 1 - r, cols - 1 - c]);
  if (start === 4) return cells.map(([r, c]) => [rows - 1 - r, c]);
  return cells;
}

function rowForward(rows, cols, start) {
  let cells = [];
  if (start === 1) { for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([r, c]); }
  else if (start === 2) { for (let c = cols - 1; c >= 0; c--) for (let r = 0; r < rows; r++) cells.push([r, c]); }
  else if (start === 3) { for (let r = rows - 1; r >= 0; r--) for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
  else if (start === 4) { for (let c = 0; c < cols; c++) for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
  return cells;
}

function colForward(rows, cols, start) {
  let cells = [];
  if (start === 1) { for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) cells.push([r, c]); }
  else if (start === 4) { for (let r = rows - 1; r >= 0; r--) for (let c = 0; c < cols; c++) cells.push([r, c]); }
  else if (start === 3) { for (let c = cols - 1; c >= 0; c--) for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
  else if (start === 2) { for (let r = 0; r < rows; r++) for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
  return cells;
}

function rowZigzag(rows, cols, start) {
  let cells = [];
  if (start === 1) {
    for (let r = 0; r < rows; r++) {
      if (r % 2 === 0) { for (let c = 0; c < cols; c++) cells.push([r, c]); }
      else { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
    }
  } else if (start === 2) {
    for (let c = cols - 1; c >= 0; c--) {
      if ((cols - 1 - c) % 2 === 0) { for (let r = 0; r < rows; r++) cells.push([r, c]); }
      else { for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
    }
  } else if (start === 3) {
    for (let r = rows - 1; r >= 0; r--) {
      if ((rows - 1 - r) % 2 === 0) { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
      else { for (let c = 0; c < cols; c++) cells.push([r, c]); }
    }
  } else if (start === 4) {
    for (let r = rows - 1; r >= 0; r--) {
      if ((rows - 1 - r) % 2 === 0) { for (let c = 0; c < cols; c++) cells.push([r, c]); }
      else { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
    }
  }
  return cells;
}

function colZigzag(rows, cols, start) {
  let cells = [];
  if (start === 1) {
    for (let c = 0; c < cols; c++) {
      if (c % 2 === 0) { for (let r = 0; r < rows; r++) cells.push([r, c]); }
      else { for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
    }
  } else if (start === 4) {
    for (let r = rows - 1; r >= 0; r--) {
      if ((rows - 1 - r) % 2 === 0) { for (let c = 0; c < cols; c++) cells.push([r, c]); }
      else { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
    }
  } else if (start === 3) {
    for (let c = cols - 1; c >= 0; c--) {
      if ((cols - 1 - c) % 2 === 0) { for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
      else { for (let r = 0; r < rows; r++) cells.push([r, c]); }
    }
  } else if (start === 2) {
    for (let r = 0; r < rows; r++) {
      if (r % 2 === 0) { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
      else { for (let c = 0; c < cols; c++) cells.push([r, c]); }
    }
  }
  return cells;
}

function getTraversalOrder(rows, cols, start, order) {
  if (order === 1) return spiralCW(rows, cols, start);
  if (order === 2) return spiralCCW(rows, cols, start);
  if (order === 3) return rowForward(rows, cols, start);
  if (order === 4) return colForward(rows, cols, start);
  if (order === 5) return rowZigzag(rows, cols, start);
  if (order === 6) return colZigzag(rows, cols, start);
  throw new Error('Invalid order: ' + order);
}

// ============================================================
// 全局状态
// ============================================================
let originalImageData = null;  // 原始图片的ImageData
let originalCanvas = null;     // 原始图片canvas
let encryptedDataURL = null;   // 加密图片的DataURL
let encryptedCanvas = null;    // 加密图片canvas
let origFileName = '';
let origFileExt = 'jpg';

// ============================================================
// UI 事件处理
// ============================================================
document.getElementById('sequenceKey').addEventListener('change', function() {
  document.getElementById('customSeqGroup').classList.toggle('hidden', this.value !== 'custom');
});

// 拖拽处理
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length > 0) loadImage(e.dataTransfer.files[0], 'left');
});

const dropZoneRight = document.getElementById('dropZoneRight');
dropZoneRight.addEventListener('dragover', (e) => { e.preventDefault(); dropZoneRight.classList.add('drag-over'); });
dropZoneRight.addEventListener('dragleave', () => dropZoneRight.classList.remove('drag-over'));
dropZoneRight.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZoneRight.classList.remove('drag-over');
  if (e.dataTransfer.files.length > 0) loadImage(e.dataTransfer.files[0], 'right');
});

function handleFileSelect(event) {
  if (event.target.files.length > 0) loadImage(event.target.files[0], 'left');
}

function handleFileSelectRight(event) {
  if (event.target.files.length > 0) loadImage(event.target.files[0], 'right');
}

function loadImage(file, side) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      if (side === 'left') {
        originalCanvas = document.createElement('canvas');
        originalCanvas.width = img.width;
        originalCanvas.height = img.height;
        const ctx = originalCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        originalImageData = ctx.getImageData(0, 0, img.width, img.height);
        
        document.getElementById('leftImg').src = e.target.result;
        document.getElementById('leftPlaceholder').classList.add('hidden');
        document.getElementById('leftPreview').classList.remove('hidden');
        document.getElementById('leftInfo').textContent = `图片尺寸: ${img.width} × ${img.height} | 文件: ${file.name}`;
        
        origFileName = file.name.replace(/\.[^.]+$/, '');
        origFileExt = file.name.split('.').pop().toLowerCase();
        if (origFileExt === 'jpeg') origFileExt = 'jpg';
        
        showToast('图片加载成功', 'success');
      } else {
        // 右侧加载加密图片
        encryptedCanvas = document.createElement('canvas');
        encryptedCanvas.width = img.width;
        encryptedCanvas.height = img.height;
        const ctx = encryptedCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        
        // 尝试从EXIF读取参数
        try {
          const dataUrl = e.target.result;
          const exifObj = piexif.load(dataUrl);
          const userComment = exifObj['Exif'][piexif.ExifIFD.UserComment];
          if (userComment) {
            let paramStr;
            if (typeof userComment === 'string') {
              paramStr = userComment;
            } else {
              // ArrayBuffer or Uint8Array
              const bytes = new Uint8Array(userComment);
              // Skip ASCII\x00\x00\x00 prefix (8 bytes)
              const start = bytes[0] === 0x41 ? 8 : 0;
              paramStr = new TextDecoder('ascii').decode(bytes.slice(start));
            }
            document.getElementById('rightInfo').textContent = `加密图片: ${img.width} × ${img.height} | 参数: ${paramStr}`;
          } else {
            document.getElementById('rightInfo').textContent = `加密图片: ${img.width} × ${img.height} | 未找到EXIF参数`;
          }
        } catch (ex) {
          document.getElementById('rightInfo').textContent = `加密图片: ${img.width} × ${img.height}`;
        }
        
        encryptedDataURL = e.target.result;
        document.getElementById('rightImg').src = e.target.result;
        document.getElementById('rightPlaceholder').classList.add('hidden');
        document.getElementById('rightPreview').classList.remove('hidden');
        
        showToast('加密图片加载成功', 'success');
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast toast-' + type + ' show';
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ============================================================
// 加密
// ============================================================
async function doEncrypt() {
  if (!originalImageData) { showToast('请先选择原始图片', 'error'); return; }
  
  const blockW = parseInt(document.getElementById('blockW').value);
  const blockH = parseInt(document.getElementById('blockH').value);
  const extractStart = parseInt(document.getElementById('extractStart').value);
  const extractOrder = parseInt(document.getElementById('extractOrder').value);
  const outputStart = parseInt(document.getElementById('outputStart').value);
  const outputOrder = parseInt(document.getElementById('outputOrder').value);
  const seqKey = document.getElementById('sequenceKey').value === 'custom' 
    ? document.getElementById('customSeq').value 
    : document.getElementById('sequenceKey').value;
  
  if (!seqKey || seqKey.trim() === '') { showToast('请提供数字序列', 'error'); return; }
  
  showProgress('right', true, 0);
  document.getElementById('btnEncrypt').disabled = true;
  
  // 使用setTimeout让UI更新
  await new Promise(r => setTimeout(r, 50));
  
  try {
    const origW = originalImageData.width;
    const origH = originalImageData.height;
    
    // Padding
    const padW = (blockW - origW % blockW) % blockW;
    const padH = (blockH - origH % blockH) % blockH;
    const paddedW = origW + padW;
    const paddedH = origH + padH;
    
    const m = Math.floor(paddedH / blockH);
    const n = Math.floor(paddedW / blockW);
    const total = m * n;
    
    showProgress('right', true, 10);
    
    // 创建填充后的canvas
    const paddedCanvas = document.createElement('canvas');
    paddedCanvas.width = paddedW;
    paddedCanvas.height = paddedH;
    const paddedCtx = paddedCanvas.getContext('2d');
    paddedCtx.fillStyle = '#000000';
    paddedCtx.fillRect(0, 0, paddedW, paddedH);
    paddedCtx.putImageData(originalImageData, 0, 0);
    const paddedData = paddedCtx.getImageData(0, 0, paddedW, paddedH);
    
    showProgress('right', true, 20);
    
    // 提取子图块
    const extractCells = getTraversalOrder(m, n, extractStart, extractOrder);
    const arrayA = []; // 每个元素是ImageData
    
    for (let i = 0; i < extractCells.length; i++) {
      const [r, c] = extractCells[i];
      const x1 = c * blockW;
      const y1 = r * blockH;
      const blockCanvas = document.createElement('canvas');
      blockCanvas.width = blockW;
      blockCanvas.height = blockH;
      const blockCtx = blockCanvas.getContext('2d');
      const blockData = paddedCtx.getImageData(x1, y1, blockW, blockH);
      blockCtx.putImageData(blockData, 0, 0);
      arrayA.push(blockCanvas);
    }
    
    showProgress('right', true, 40);
    
    // 数字序列驱动填充
    const digits = getDigitSequence(seqKey, total);
    const outputCells = getTraversalOrder(m, n, outputStart, outputOrder);
    
    const gridB = Array.from({length: m}, () => Array(n).fill(null));
    let posIdx = 0;
    let digitIdx = 0;
    
    for (let inputIdx = 0; inputIdx < total; inputIdx++) {
      let placed = false;
      while (!placed && digitIdx < digits.length) {
        const d = digits[digitIdx++];
        if (d === 0) continue;
        
        for (let s = 0; s < d; s++) {
          posIdx++;
          if (posIdx >= total) posIdx = 0;
        }
        
        let attempts = 0;
        while (gridB[outputCells[posIdx][0]][outputCells[posIdx][1]] !== null) {
          posIdx++;
          if (posIdx >= total) posIdx = 0;
          attempts++;
          if (attempts > total * 2) throw new Error('填充过程出错');
        }
        
        const [r, c] = outputCells[posIdx];
        gridB[r][c] = arrayA[inputIdx];
        placed = true;
      }
      if (!placed) throw new Error('数字序列不足');
      
      if (inputIdx % 100 === 0) {
        showProgress('right', true, 40 + Math.floor(inputIdx / total * 40));
        await new Promise(r => setTimeout(r, 0));
      }
    }
    
    showProgress('right', true, 80);
    
    // 拼接加密图片
    encryptedCanvas = document.createElement('canvas');
    encryptedCanvas.width = paddedW;
    encryptedCanvas.height = paddedH;
    const encCtx = encryptedCanvas.getContext('2d');
    encCtx.fillStyle = '#000000';
    encCtx.fillRect(0, 0, paddedW, paddedH);
    
    for (let r = 0; r < m; r++) {
      for (let c = 0; c < n; c++) {
        encCtx.drawImage(gridB[r][c], c * blockW, r * blockH);
      }
    }
    
    showProgress('right', true, 90);
    
    // 保存加密图片（含EXIF）
    const paramStr = `${padW}x${padH}_${blockW}x${blockH}_${extractStart}${extractOrder}_${outputStart}${outputOrder}.${origFileExt}.${seqKey}`;
    
    // 生成带EXIF的DataURL
    let dataURL = encryptedCanvas.toDataURL('image/png');
    try {
      const exifObj = {"0th": {}, "Exif": {}, "GPS": {}, "1st": {}, "Interop": {}};
      const userCommentBytes = new Uint8Array(8 + paramStr.length);
      // ASCII prefix
      userCommentBytes[0] = 0x41; userCommentBytes[1] = 0x53; userCommentBytes[2] = 0x43;
      userCommentBytes[3] = 0x49; userCommentBytes[4] = 0x49; userCommentBytes[5] = 0x00;
      userCommentBytes[6] = 0x00; userCommentBytes[7] = 0x00;
      for (let i = 0; i < paramStr.length; i++) {
        userCommentBytes[8 + i] = paramStr.charCodeAt(i);
      }
      exifObj["Exif"][piexif.ExifIFD.UserComment] = userCommentBytes.buffer;
      const exifBytes = piexif.dump(exifObj);
      dataURL = piexif.insert(exifBytes, dataURL);
    } catch (ex) {
      console.warn('EXIF写入失败，将保存不含EXIF的图片:', ex);
    }
    
    encryptedDataURL = dataURL;
    
    // 在右侧显示
    document.getElementById('rightImg').src = dataURL;
    document.getElementById('rightPlaceholder').classList.add('hidden');
    document.getElementById('rightPreview').classList.remove('hidden');
    document.getElementById('rightInfo').textContent = `加密图片: ${paddedW} × ${paddedH} | 参数: ${paramStr}`;
    document.getElementById('btnSave').disabled = false;
    
    showProgress('right', false);
    showToast('加密完成！', 'success');
    
  } catch (e) {
    showProgress('right', false);
    showToast('加密失败: ' + e.message, 'error');
    console.error(e);
  }
  
  document.getElementById('btnEncrypt').disabled = false;
}

// ============================================================
// 解密
// ============================================================
async function doDecrypt() {
  if (!encryptedCanvas) { showToast('请先加载或生成加密图片', 'error'); return; }
  
  showProgress('left', true, 0);
  document.getElementById('btnDecrypt').disabled = true;
  
  await new Promise(r => setTimeout(r, 50));
  
  try {
    // 从EXIF中读取解密参数
    let paramStr = '';
    try {
      const exifObj = piexif.load(encryptedDataURL);
      const userComment = exifObj['Exif'][piexif.ExifIFD.UserComment];
      if (userComment) {
        if (typeof userComment === 'string') {
          paramStr = userComment;
        } else {
          const bytes = new Uint8Array(userComment);
          const start = bytes[0] === 0x41 ? 8 : 0;
          paramStr = new TextDecoder('ascii').decode(bytes.slice(start));
        }
      }
    } catch (ex) {
      throw new Error('无法读取EXIF数据: ' + ex.message);
    }
    
    if (!paramStr) throw new Error('加密图片中未找到解密参数');
    
    // 解析参数
    const parts = paramStr.split('_');
    const [padW, padH] = parts[0].split('x').map(Number);
    const [blockW, blockH] = parts[1].split('x').map(Number);
    const extractStart = parseInt(parts[2][0]);
    const extractOrder = parseInt(parts[2][1]);
    const restParts = parts[3].split('.');
    const outputStart = parseInt(restParts[0][0]);
    const outputOrder = parseInt(restParts[0][1]);
    const origFormat = restParts[1];
    const sequenceKey = restParts[2];
    
    showProgress('left', true, 10);
    
    const encCtx = encryptedCanvas.getContext('2d');
    const paddedW = encryptedCanvas.width;
    const paddedH = encryptedCanvas.height;
    const m = Math.floor(paddedH / blockH);
    const n = Math.floor(paddedW / blockW);
    const total = m * n;
    
    // 从加密图片提取子图块
    const gridB = Array.from({length: m}, () => Array(n).fill(null));
    for (let r = 0; r < m; r++) {
      for (let c = 0; c < n; c++) {
        const blockCanvas = document.createElement('canvas');
        blockCanvas.width = blockW;
        blockCanvas.height = blockH;
        const blockCtx = blockCanvas.getContext('2d');
        const blockData = encCtx.getImageData(c * blockW, r * blockH, blockW, blockH);
        blockCtx.putImageData(blockData, 0, 0);
        gridB[r][c] = blockCanvas;
      }
    }
    
    showProgress('left', true, 30);
    
    // 逆向恢复数组A
    const digits = getDigitSequence(sequenceKey, total);
    const outputCells = getTraversalOrder(m, n, outputStart, outputOrder);
    
    const placement = new Array(total).fill(null);
    const filled = Array.from({length: m}, () => Array(n).fill(false));
    let posIdx = 0;
    let digitIdx = 0;
    
    for (let inputIdx = 0; inputIdx < total; inputIdx++) {
      let placed = false;
      while (!placed && digitIdx < digits.length) {
        const d = digits[digitIdx++];
        if (d === 0) continue;
        
        for (let s = 0; s < d; s++) {
          posIdx++;
          if (posIdx >= total) posIdx = 0;
        }
        
        let attempts = 0;
        while (filled[outputCells[posIdx][0]][outputCells[posIdx][1]]) {
          posIdx++;
          if (posIdx >= total) posIdx = 0;
          attempts++;
          if (attempts > total * 2) throw new Error('解密过程出错');
        }
        
        const [r, c] = outputCells[posIdx];
        placement[inputIdx] = [r, c];
        filled[r][c] = true;
        placed = true;
      }
      if (!placed) throw new Error('数字序列不足');
      
      if (inputIdx % 100 === 0) {
        showProgress('left', true, 30 + Math.floor(inputIdx / total * 40));
        await new Promise(r => setTimeout(r, 0));
      }
    }
    
    showProgress('left', true, 70);
    
    // 从gridB中按placement顺序提取，恢复arrayA
    const arrayA = [];
    for (let i = 0; i < total; i++) {
      const [r, c] = placement[i];
      arrayA.push(gridB[r][c]);
    }
    
    // 逆提取：将arrayA按提取顺序恢复到原始位置
    const extractCells = getTraversalOrder(m, n, extractStart, extractOrder);
    
    const decryptedCanvas = document.createElement('canvas');
    decryptedCanvas.width = paddedW;
    decryptedCanvas.height = paddedH;
    const decCtx = decryptedCanvas.getContext('2d');
    decCtx.fillStyle = '#000000';
    decCtx.fillRect(0, 0, paddedW, paddedH);
    
    for (let i = 0; i < extractCells.length; i++) {
      const [r, c] = extractCells[i];
      decCtx.drawImage(arrayA[i], c * blockW, r * blockH);
    }
    
    showProgress('left', true, 90);
    
    // 去除Padding
    const origW = paddedW - padW;
    const origH = paddedH - padH;
    const finalData = decCtx.getImageData(0, 0, origW, origH);
    
    // 在左侧显示
    const leftCanvas = document.createElement('canvas');
    leftCanvas.width = origW;
    leftCanvas.height = origH;
    leftCanvas.getContext('2d').putImageData(finalData, 0, 0);
    
    originalImageData = finalData;
    originalCanvas = leftCanvas;
    
    document.getElementById('leftImg').src = leftCanvas.toDataURL('image/png');
    document.getElementById('leftPlaceholder').classList.add('hidden');
    document.getElementById('leftPreview').classList.remove('hidden');
    document.getElementById('leftInfo').textContent = `解密图片: ${origW} × ${origH} | 参数: ${paramStr}`;
    
    showProgress('left', false);
    showToast('解密完成！', 'success');
    
  } catch (e) {
    showProgress('left', false);
    showToast('解密失败: ' + e.message, 'error');
    console.error(e);
  }
  
  document.getElementById('btnDecrypt').disabled = false;
}

// ============================================================
// 保存加密图片
// ============================================================
function doSave() {
  if (!encryptedDataURL) { showToast('没有可保存的加密图片', 'error'); return; }
  
  const link = document.createElement('a');
  link.download = (origFileName || 'encrypted') + '_encrypted.png';
  link.href = encryptedDataURL;
  link.click();
  
  showToast('加密图片已保存', 'success');
}

// ============================================================
// 进度条
// ============================================================
function showProgress(side, show, pct) {
  const id = side === 'left' ? 'leftProgress' : 'rightProgress';
  const fillId = side === 'left' ? 'leftProgressFill' : 'rightProgressFill';
  document.getElementById(id).classList.toggle('hidden', !show);
  if (show) document.getElementById(fillId).style.width = pct + '%';
}
