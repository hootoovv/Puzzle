<script>
// ============================================================
// 数学常数数字序列
// ============================================================
// 30万位数学常数数字序列从外部文件加载

function getDigitSequence(key, count) {
  let str;
  if (key === 'pi') str = PI_STR;
  else if (key === 'e') str = E_STR;
  else if (key === 'phi') str = PHI_STR;
  else str = key;
  
  const needed = Math.max(Math.ceil(count * 1.5), 1000);
  let digits = [];
  for (let i = 0; i < str.length && digits.length < needed; i++) {
    const ch = str[i];
    if (ch >= '0' && ch <= '9') digits.push(parseInt(ch));
  }
  return digits;
}

// ============================================================
// PNG tEXt 块读写（替代 piexifjs）
// ============================================================
const crcTable = (function() {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) {
      if (c & 1) c = 0xEDB88320 ^ (c >>> 1);
      else c = c >>> 1;
    }
    table[n] = c;
  }
  return table;
})();

function crc32(buf) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < buf.length; i++) {
    crc = crcTable[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function readPNGTextChunks(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const sig = [137, 80, 78, 71, 13, 10, 26, 10];
  for (let i = 0; i < 8; i++) {
    if (bytes[i] !== sig[i]) return {};
  }
  
  const texts = {};
  let offset = 8;
  const view = new DataView(arrayBuffer);
  while (offset + 12 <= arrayBuffer.byteLength) {
    const length = view.getUint32(offset);
    const type = String.fromCharCode(
      bytes[offset + 4], bytes[offset + 5],
      bytes[offset + 6], bytes[offset + 7]
    );
    if (type === 'tEXt') {
      const dataStart = offset + 8;
      if (dataStart + length <= arrayBuffer.byteLength) {
        const data = bytes.slice(dataStart, dataStart + length);
        const nullIdx = data.indexOf(0);
        if (nullIdx >= 0) {
          const keyword = new TextDecoder('latin1').decode(data.slice(0, nullIdx));
          const text = new TextDecoder('utf-8').decode(data.slice(nullIdx + 1));
          texts[keyword] = text;
        }
      }
    }
    if (type === 'IEND') break;
    offset += 12 + length;
  }
  return texts;
}

function insertPNGTextChunk(arrayBuffer, keyword, text) {
  const keywordBytes = new TextEncoder().encode(keyword);
  const textBytes = new TextEncoder().encode(text);
  const chunkData = new Uint8Array(keywordBytes.length + 1 + textBytes.length);
  chunkData.set(keywordBytes, 0);
  chunkData[keywordBytes.length] = 0;
  chunkData.set(textBytes, keywordBytes.length + 1);
  
  const typeBytes = new TextEncoder().encode('tEXt');
  const crcInput = new Uint8Array(4 + chunkData.length);
  crcInput.set(typeBytes, 0);
  crcInput.set(chunkData, 4);
  const crcVal = crc32(crcInput);
  
  const chunk = new Uint8Array(12 + chunkData.length);
  const chunkView = new DataView(chunk.buffer);
  chunkView.setUint32(0, chunkData.length);
  chunk.set(typeBytes, 4);
  chunk.set(chunkData, 8);
  chunkView.setUint32(8 + chunkData.length, crcVal);
  
  const src = new Uint8Array(arrayBuffer);
  const ihdrLength = new DataView(arrayBuffer).getUint32(8) + 12;
  const insertPos = 8 + ihdrLength;
  
  const result = new Uint8Array(src.length + chunk.length);
  result.set(src.slice(0, insertPos), 0);
  result.set(chunk, insertPos);
  result.set(src.slice(insertPos), insertPos + chunk.length);
  
  return result.buffer;
}

function dataURLToArrayBuffer(dataURL) {
  const base64 = dataURL.split(',')[1];
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) {
    bytes[i] = binary.charCodeAt(i);
  }
  return bytes.buffer;
}

function arrayBufferToDataURL(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  const chunks = [];
  const chunkSize = 8192;
  for (let i = 0; i < bytes.length; i += chunkSize) {
    chunks.push(String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + chunkSize, bytes.length))));
  }
  return 'data:image/png;base64,' + btoa(chunks.join(''));
}

// ============================================================
// 遍历顺序生成函数
// ============================================================
function spiralCW(rows, cols, start) {
  let result = [];
  let top = 0, bottom = rows - 1, left = 0, right = cols - 1;
  while (top <= bottom && left <= right) {
    for (let c = left; c <= right; c++) result.push([top, c]);
    top++;
    for (let r = top; r <= bottom; r++) result.push([r, right]);
    right--;
    if (top <= bottom) { for (let c = right; c >= left; c--) result.push([bottom, c]); bottom--; }
    if (left <= right) { for (let r = bottom; r >= top; r--) result.push([r, left]); left++; }
  }
  return transformCells(result, rows, cols, start);
}

function spiralCCW(rows, cols, start) {
  let result = [];
  let top = 0, bottom = rows - 1, left = 0, right = cols - 1;
  while (top <= bottom && left <= right) {
    for (let c = right; c >= left; c--) result.push([top, c]);
    top++;
    for (let r = top; r <= bottom; r++) result.push([r, left]);
    left++;
    if (top <= bottom) { for (let c = left; c <= right; c++) result.push([bottom, c]); bottom--; }
    if (left <= right) { for (let r = bottom; r >= top; r--) result.push([r, right]); right--; }
  }
  return transformCells(result, rows, cols, start);
}

function transformCells(cells, rows, cols, start) {
  if (start === 1) return cells;
  if (start === 2) return cells.map(([r, c]) => [r, cols - 1 - c]);
  if (start === 3) return cells.map(([r, c]) => [rows - 1 - r, cols - 1 - c]);
  if (start === 4) return cells.map(([r, c]) => [rows - 1 - r, c]);
  return cells;
}

function rowForward(rows, cols, start) {
  let cells = [];
  if (start === 1) { for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([r, c]); }
  else if (start === 2) { for (let c = cols - 1; c >= 0; c--) for (let r = 0; r < rows; r++) cells.push([r, c]); }
  else if (start === 3) { for (let r = rows - 1; r >= 0; r--) for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
  else if (start === 4) { for (let c = 0; c < cols; c++) for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
  return cells;
}

function colForward(rows, cols, start) {
  let cells = [];
  if (start === 1) { for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) cells.push([r, c]); }
  else if (start === 4) { for (let r = rows - 1; r >= 0; r--) for (let c = 0; c < cols; c++) cells.push([r, c]); }
  else if (start === 3) { for (let c = cols - 1; c >= 0; c--) for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
  else if (start === 2) { for (let r = 0; r < rows; r++) for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
  return cells;
}

function rowZigzag(rows, cols, start) {
  let cells = [];
  if (start === 1) {
    for (let r = 0; r < rows; r++) {
      if (r % 2 === 0) { for (let c = 0; c < cols; c++) cells.push([r, c]); }
      else { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
    }
  } else if (start === 2) {
    for (let c = cols - 1; c >= 0; c--) {
      if ((cols - 1 - c) % 2 === 0) { for (let r = 0; r < rows; r++) cells.push([r, c]); }
      else { for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
    }
  } else if (start === 3) {
    for (let r = rows - 1; r >= 0; r--) {
      if ((rows - 1 - r) % 2 === 0) { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
      else { for (let c = 0; c < cols; c++) cells.push([r, c]); }
    }
  } else if (start === 4) {
    for (let r = rows - 1; r >= 0; r--) {
      if ((rows - 1 - r) % 2 === 0) { for (let c = 0; c < cols; c++) cells.push([r, c]); }
      else { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
    }
  }
  return cells;
}

function colZigzag(rows, cols, start) {
  let cells = [];
  if (start === 1) {
    for (let c = 0; c < cols; c++) {
      if (c % 2 === 0) { for (let r = 0; r < rows; r++) cells.push([r, c]); }
      else { for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
    }
  } else if (start === 4) {
    for (let r = rows - 1; r >= 0; r--) {
      if ((rows - 1 - r) % 2 === 0) { for (let c = 0; c < cols; c++) cells.push([r, c]); }
      else { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
    }
  } else if (start === 3) {
    for (let c = cols - 1; c >= 0; c--) {
      if ((cols - 1 - c) % 2 === 0) { for (let r = rows - 1; r >= 0; r--) cells.push([r, c]); }
      else { for (let r = 0; r < rows; r++) cells.push([r, c]); }
    }
  } else if (start === 2) {
    for (let r = 0; r < rows; r++) {
      if (r % 2 === 0) { for (let c = cols - 1; c >= 0; c--) cells.push([r, c]); }
      else { for (let c = 0; c < cols; c++) cells.push([r, c]); }
    }
  }
  return cells;
}

function getTraversalOrder(rows, cols, start, order) {
  if (order === 1) return spiralCW(rows, cols, start);
  if (order === 2) return spiralCCW(rows, cols, start);
  if (order === 3) return rowForward(rows, cols, start);
  if (order === 4) return colForward(rows, cols, start);
  if (order === 5) return rowZigzag(rows, cols, start);
  if (order === 6) return colZigzag(rows, cols, start);
  throw new Error('Invalid order: ' + order);
}

// ============================================================

// ============================================================
function parseParamStr(paramStr) {
  // 格式: padWxpadH_blockWxblockH_extractStartExtractOrder_outputStartOutputOrder.origFormat.sequenceKey
  const parts = paramStr.split('_');
  if (parts.length < 4) return null;
  
  const [padW, padH] = parts[0].split('x').map(Number);
  const [blockW, blockH] = parts[1].split('x').map(Number);
  const extractStart = parseInt(parts[2][0]);
  const extractOrder = parseInt(parts[2][1]);
  const restParts = parts[3].split('.');
  const outputStart = parseInt(restParts[0][0]);
  const outputOrder = parseInt(restParts[0][1]);
  const origFormat = restParts[1] || 'jpg';
  const sequenceKey = restParts[2] || 'pi';
  
  return { padW, padH, blockW, blockH, extractStart, extractOrder, outputStart, outputOrder, origFormat, sequenceKey };
}

function fillParamsFromParsed(params) {
  document.getElementById('blockW').value = params.blockW;
  document.getElementById('blockH').value = params.blockH;
  document.getElementById('extractStart').value = params.extractStart;
  document.getElementById('extractOrder').value = params.extractOrder;
  document.getElementById('outputStart').value = params.outputStart;
  document.getElementById('outputOrder').value = params.outputOrder;
  
  // 序列键处理
  const seqSelect = document.getElementById('sequenceKey');
  const knownKeys = ['pi', 'e', 'phi'];
  if (knownKeys.includes(params.sequenceKey)) {
    seqSelect.value = params.sequenceKey;
    document.getElementById('customSeqGroup').classList.add('hidden');
  } else {
    seqSelect.value = 'custom';
    document.getElementById('customSeqGroup').classList.remove('hidden');
    document.getElementById('customSeq').value = params.sequenceKey;
  }
  
  origFileExt = params.origFormat;
}

function suggestBlockSize(w, h) {
  const seqKey = document.getElementById('sequenceKey').value === 'custom' 
    ? document.getElementById('customSeq').value 
    : document.getElementById('sequenceKey').value;
  // Only suggest for known keys (pi/e/phi have 300K digits)
  const knownKeys = { pi: true, e: true, phi: true };
  if (!knownKeys[seqKey]) return;
  
  const maxDigits = 300000; // 30万位
  const maxBlocks = Math.floor(maxDigits / 1.5);
  
  // Try block sizes: 8, 16, 32, 64
  const blockSizes = [8, 16, 32, 64];
  let suggestedW = 8, suggestedH = 8;
  
  for (const bs of blockSizes) {
    const padW = (bs - w % bs) % bs;
    const padH = (bs - h % bs) % bs;
    const m = Math.floor((h + padH) / bs);
    const n = Math.floor((w + padW) / bs);
    const total = m * n;
    if (total <= maxBlocks) {
      suggestedW = bs;
      suggestedH = bs;
      break; // Use the smallest block size that fits
    }
  }
  
  const curW = parseInt(document.getElementById('blockW').value) || 8;
  const curH = parseInt(document.getElementById('blockH').value) || 8;
  
  // Check if current block size is sufficient
  const padW = (curW - w % curW) % curW;
  const padH = (curH - h % curH) % curH;
  const m = Math.floor((h + padH) / curH);
  const n = Math.floor((w + padW) / curW);
  const total = m * n;
  
  if (total > maxBlocks && suggestedW !== curW) {
    document.getElementById('blockW').value = suggestedW;
    document.getElementById('blockH').value = suggestedH;
    showToast(`图片较大，块大小已自动调整为 ${suggestedW}x${suggestedH}（${total}块 > ${maxBlocks}上限）`, 'info');
  } else if (total > maxBlocks) {
    showToast(`当前块大小下图片块数(${total})超出序列容量(${maxBlocks})，请增大块大小`, 'error');
  }
}

function loadImage(file, side) {
  // 如果当前已有模式且与请求方向不匹配，先重置
  if (currentMode && ((side === 'left' && currentMode !== 'encrypt') || (side === 'right' && currentMode !== 'decrypt'))) {
    resetAll();
  }
  
  if (side === 'right') {
    // 右侧加载加密图片 — 需要读取ArrayBuffer以解析PNG元数据
    const arrayBufferReader = new FileReader();
    arrayBufferReader.onload = function(abEvent) {
      const arrayBuffer = abEvent.target.result;
      encryptedArrayBuffer = arrayBuffer;
      
      // 解析PNG tEXt块
      const textChunks = readPNGTextChunks(arrayBuffer);
      let paramStr = textChunks['Parameters'] || textChunks['parameters'] || '';
      
      // 同时读取为DataURL以显示图片
      const dataUrlReader = new FileReader();
      dataUrlReader.onload = function(duEvent) {
        const img = new Image();
        img.onload = function() {
          encryptedCanvas = document.createElement('canvas');
          encryptedCanvas.width = img.width;
          encryptedCanvas.height = img.height;
          const ctx = encryptedCanvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          
          encryptedDataURL = duEvent.target.result;
          
          document.getElementById('rightImg').src = duEvent.target.result;
          document.getElementById('rightPlaceholder').classList.add('hidden');
          document.getElementById('rightPreview').classList.remove('hidden');
          
          if (paramStr) {
            decryptedParamStr = paramStr;
            const parsed = parseParamStr(paramStr);
            if (parsed) {
              fillParamsFromParsed(parsed);
              document.getElementById('rightInfo').textContent = 
                `加密图片: ${img.width} \u00D7 ${img.height} | 参数: ${paramStr}`;
              
              // 切换到解密模式
              currentMode = 'decrypt';
              updateUI();
              showToast('加密图片加载成功，已自动读取解密参数', 'success');
            } else {
              document.getElementById('rightInfo').textContent = 
                `加密图片: ${img.width} \u00D7 ${img.height} | 参数格式无法识别: ${paramStr}`;
              currentMode = 'decrypt';
              updateUI();
              showToast('加密图片加载成功，但参数格式无法自动识别', 'error');
            }
          } else {
            document.getElementById('rightInfo').textContent = 
              `加密图片: ${img.width} \u00D7 ${img.height} | 未找到加密参数元数据`;
            currentMode = 'decrypt';
            updateUI();
            showToast('加密图片加载成功，但未找到加密参数', 'error');
          }
        };
        img.src = duEvent.target.result;
      };
      dataUrlReader.readAsDataURL(file);
    };
    arrayBufferReader.readAsArrayBuffer(file);
    
  } else {
    // 左侧加载原始图片
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        originalCanvas = document.createElement('canvas');
        originalCanvas.width = img.width;
        originalCanvas.height = img.height;
        const ctx = originalCanvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        originalImageData = ctx.getImageData(0, 0, img.width, img.height);
        
        document.getElementById('leftImg').src = e.target.result;
        document.getElementById('leftPlaceholder').classList.add('hidden');
        document.getElementById('leftPreview').classList.remove('hidden');
        document.getElementById('leftInfo').textContent = `图片尺寸: ${img.width} \u00D7 ${img.height} | 文件: ${file.name}`;
        
        origFileName = file.name.replace(/\.[^.]+$/, '');
        origFileExt = file.name.split('.').pop().toLowerCase();
        if (origFileExt === 'jpeg') origFileExt = 'jpg';
        
        // 清除右侧加密图片状态（切换到加密模式）
        encryptedDataURL = null;
        encryptedCanvas = null;
        encryptedArrayBuffer = null;
        document.getElementById('rightImg').src = '';
        document.getElementById('rightPlaceholder').classList.remove('hidden');
        document.getElementById('rightPreview').classList.add('hidden');
        document.getElementById('rightInfo').textContent = '尚未生成加密图片';
        document.getElementById('fileInputRight').value = '';
        
        currentMode = 'encrypt';
        suggestBlockSize(img.width, img.height);
        updateUI();
        showToast('原始图片加载成功，可设置参数后点击加密', 'success');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
}

// ============================================================
// 加密
// ============================================================
async function doEncrypt() {
  if (!originalImageData) { showToast('请先选择原始图片', 'error'); return; }
  
  const blockW = parseInt(document.getElementById('blockW').value);
  const blockH = parseInt(document.getElementById('blockH').value);
  const extractStart = parseInt(document.getElementById('extractStart').value);
  const extractOrder = parseInt(document.getElementById('extractOrder').value);
  const outputStart = parseInt(document.getElementById('outputStart').value);
  const outputOrder = parseInt(document.getElementById('outputOrder').value);
  const seqKey = document.getElementById('sequenceKey').value === 'custom' 
    ? document.getElementById('customSeq').value 
    : document.getElementById('sequenceKey').value;
  
  if (!seqKey || seqKey.trim() === '') { showToast('请提供数字序列', 'error'); return; }
  
  showProgress('right', true, 0);
  document.getElementById('btnEncrypt').disabled = true;
  
  await new Promise(r => setTimeout(r, 50));
  
  try {
    const origW = originalImageData.width;
    const origH = originalImageData.height;
    
    const padW = (blockW - origW % blockW) % blockW;
    const padH = (blockH - origH % blockH) % blockH;
    const paddedW = origW + padW;
    const paddedH = origH + padH;
    
    const m = Math.floor(paddedH / blockH);
    const n = Math.floor(paddedW / blockW);
    const total = m * n;
    
    showProgress('right', true, 10);
    
    const paddedCanvas = document.createElement('canvas');
    paddedCanvas.width = paddedW;
    paddedCanvas.height = paddedH;
    const paddedCtx = paddedCanvas.getContext('2d');
    paddedCtx.fillStyle = '#000000';
    paddedCtx.fillRect(0, 0, paddedW, paddedH);
    paddedCtx.putImageData(originalImageData, 0, 0);
    const paddedData = paddedCtx.getImageData(0, 0, paddedW, paddedH);
    
    showProgress('right', true, 20);
    
    const extractCells = getTraversalOrder(m, n, extractStart, extractOrder);
    const arrayA = [];
    
    for (let i = 0; i < extractCells.length; i++) {
      const [r, c] = extractCells[i];
      const x1 = c * blockW;
      const y1 = r * blockH;
      const blockCanvas = document.createElement('canvas');
      blockCanvas.width = blockW;
      blockCanvas.height = blockH;
      const blockCtx = blockCanvas.getContext('2d');
      const blockData = paddedCtx.getImageData(x1, y1, blockW, blockH);
      blockCtx.putImageData(blockData, 0, 0);
      arrayA.push(blockCanvas);
    }
    
    showProgress('right', true, 40);
    
    const digits = getDigitSequence(seqKey, total);
    const outputCells = getTraversalOrder(m, n, outputStart, outputOrder);
    
    const gridB = Array.from({length: m}, () => Array(n).fill(null));
    let posIdx = 0;
    let digitIdx = 0;
    
    for (let inputIdx = 0; inputIdx < total; inputIdx++) {
      let placed = false;
      while (!placed && digitIdx < digits.length) {
        const d = digits[digitIdx++];
        if (d === 0) continue;
        
        for (let s = 0; s < d; s++) {
          posIdx++;
          if (posIdx >= total) posIdx = 0;
        }
        
        let attempts = 0;
        while (gridB[outputCells[posIdx][0]][outputCells[posIdx][1]] !== null) {
          posIdx++;
          if (posIdx >= total) posIdx = 0;
          attempts++;
          if (attempts > total * 2) throw new Error('填充过程出错');
        }
        
        const [r, c] = outputCells[posIdx];
        gridB[r][c] = arrayA[inputIdx];
        placed = true;
      }
      if (!placed) throw new Error('数字序列不足');
      
      if (inputIdx % 100 === 0) {
        showProgress('right', true, 40 + Math.floor(inputIdx / total * 40));
        await new Promise(r => setTimeout(r, 0));
      }
    }
    
    showProgress('right', true, 80);
    
    encryptedCanvas = document.createElement('canvas');
    encryptedCanvas.width = paddedW;
    encryptedCanvas.height = paddedH;
    const encCtx = encryptedCanvas.getContext('2d');
    encCtx.fillStyle = '#000000';
    encCtx.fillRect(0, 0, paddedW, paddedH);
    
    for (let r = 0; r < m; r++) {
      for (let c = 0; c < n; c++) {
        encCtx.drawImage(gridB[r][c], c * blockW, r * blockH);
      }
    }
    
    showProgress('right', true, 90);
    
    // 使用PNG tEXt块保存加密参数
    const paramStr = `${padW}x${padH}_${blockW}x${blockH}_${extractStart}${extractOrder}_${outputStart}${outputOrder}.${origFileExt}.${seqKey}`;
    
    let rawPngBuffer = dataURLToArrayBuffer(encryptedCanvas.toDataURL('image/png'));
    rawPngBuffer = insertPNGTextChunk(rawPngBuffer, 'Parameters', paramStr);
    encryptedDataURL = arrayBufferToDataURL(rawPngBuffer);
    encryptedArrayBuffer = rawPngBuffer;
    
    document.getElementById('rightImg').src = encryptedDataURL;
    document.getElementById('rightPlaceholder').classList.add('hidden');
    document.getElementById('rightPreview').classList.remove('hidden');
    document.getElementById('rightInfo').textContent = `加密图片: ${paddedW} \u00D7 ${paddedH} | 参数: ${paramStr}`;
    
    showProgress('right', false);
    showToast('加密完成！可点击"保存加密图"下载', 'success');
    // 移除右侧面板的disabled-panel以避免图片半透明
    document.getElementById('rightPanel').classList.remove('disabled-panel');
    
  } catch (e) {
    showProgress('right', false);
    showToast('加密失败: ' + e.message, 'error');
    console.error(e);
  }
  
  updateUI();
}

// ============================================================
// 解密
// ============================================================
async function doDecrypt() {
  if (!encryptedCanvas) { showToast('请先加载加密图片', 'error'); return; }
  
  showProgress('left', true, 0);
  document.getElementById('btnDecrypt').disabled = true;
  
  await new Promise(r => setTimeout(r, 50));
  
  try {
    // 从PNG tEXt块中读取解密参数
    let paramStr = '';
    
    // 优先从ArrayBuffer读取（加载的文件）
    if (encryptedArrayBuffer) {
      const textChunks = readPNGTextChunks(encryptedArrayBuffer);
      paramStr = textChunks['Parameters'] || textChunks['parameters'] || '';
    }
    
    // 如果ArrayBuffer没有，尝试从DataURL中读取
    if (!paramStr && encryptedDataURL) {
      try {
        const ab = dataURLToArrayBuffer(encryptedDataURL);
        const textChunks = readPNGTextChunks(ab);
        paramStr = textChunks['Parameters'] || textChunks['parameters'] || '';
      } catch(ex) {
        console.warn('从DataURL解析PNG元数据失败:', ex);
      }
    }
    
    if (!paramStr) throw new Error('加密图片中未找到解密参数（PNG tEXt块中无Parameters字段）');
    
    const params = parseParamStr(paramStr);
    if (!params) throw new Error('参数格式无法解析: ' + paramStr);
    
    const { padW, padH, blockW, blockH, extractStart, extractOrder, outputStart, outputOrder, sequenceKey } = params;
    
    showProgress('left', true, 10);
    
    const encCtx = encryptedCanvas.getContext('2d');
    const paddedW = encryptedCanvas.width;
    const paddedH = encryptedCanvas.height;
    const m = Math.floor(paddedH / blockH);
    const n = Math.floor(paddedW / blockW);
    const total = m * n;
    
    // 从加密图片提取子图块
    const gridB = Array.from({length: m}, () => Array(n).fill(null));
    for (let r = 0; r < m; r++) {
      for (let c = 0; c < n; c++) {
        const blockCanvas = document.createElement('canvas');
        blockCanvas.width = blockW;
        blockCanvas.height = blockH;
        const blockCtx = blockCanvas.getContext('2d');
        const blockData = encCtx.getImageData(c * blockW, r * blockH, blockW, blockH);
        blockCtx.putImageData(blockData, 0, 0);
        gridB[r][c] = blockCanvas;
      }
    }
    
    showProgress('left', true, 30);
    
    // 逆向恢复数组A
    const digits = getDigitSequence(sequenceKey, total);
    const outputCells = getTraversalOrder(m, n, outputStart, outputOrder);
    
    const placement = new Array(total).fill(null);
    const filled = Array.from({length: m}, () => Array(n).fill(false));
    let posIdx = 0;
    let digitIdx = 0;
    
    for (let inputIdx = 0; inputIdx < total; inputIdx++) {
      let placed = false;
      while (!placed && digitIdx < digits.length) {
        const d = digits[digitIdx++];
        if (d === 0) continue;
        
        for (let s = 0; s < d; s++) {
          posIdx++;
          if (posIdx >= total) posIdx = 0;
        }
        
        let attempts = 0;
        while (filled[outputCells[posIdx][0]][outputCells[posIdx][1]]) {
          posIdx++;
          if (posIdx >= total) posIdx = 0;
          attempts++;
          if (attempts > total * 2) throw new Error('解密过程出错');
        }
        
        const [r, c] = outputCells[posIdx];
        placement[inputIdx] = [r, c];
        filled[r][c] = true;
        placed = true;
      }
      if (!placed) throw new Error('数字序列不足');
      
      if (inputIdx % 100 === 0) {
        showProgress('left', true, 30 + Math.floor(inputIdx / total * 40));
        await new Promise(r => setTimeout(r, 0));
      }
    }
    
    showProgress('left', true, 70);
    
    // 从gridB中按placement顺序提取，恢复arrayA
    const arrayA = [];
    for (let i = 0; i < total; i++) {
      const [r, c] = placement[i];
      arrayA.push(gridB[r][c]);
    }
    
    // 逆提取：将arrayA按提取顺序恢复到原始位置
    const extractCells = getTraversalOrder(m, n, extractStart, extractOrder);
    
    const decTempCanvas = document.createElement('canvas');
    decTempCanvas.width = paddedW;
    decTempCanvas.height = paddedH;
    const decCtx = decTempCanvas.getContext('2d');
    decCtx.fillStyle = '#000000';
    decCtx.fillRect(0, 0, paddedW, paddedH);
    
    for (let i = 0; i < extractCells.length; i++) {
      const [r, c] = extractCells[i];
      decCtx.drawImage(arrayA[i], c * blockW, r * blockH);
    }
    
    showProgress('left', true, 90);
    
    // 去除Padding
    const origW = paddedW - padW;
    const origH = paddedH - padH;
    const finalData = decCtx.getImageData(0, 0, origW, origH);
    
    const leftCanvas = document.createElement('canvas');
    leftCanvas.width = origW;
    leftCanvas.height = origH;
    leftCanvas.getContext('2d').putImageData(finalData, 0, 0);
    
    originalImageData = finalData;
    originalCanvas = leftCanvas;
    
    // Store decrypted data in original format
    const decMime = origFileExt === 'jpg' ? 'image/jpeg' : origFileExt === 'webp' ? 'image/webp' : 'image/png';
    decryptedDataURL = leftCanvas.toDataURL(decMime, 0.95);
    decryptedCanvas = leftCanvas; // Keep canvas for re-export if needed
    document.getElementById('leftImg').src = decryptedDataURL;
    document.getElementById('leftPlaceholder').classList.add('hidden');
    document.getElementById('leftPreview').classList.remove('hidden');
    document.getElementById('leftInfo').textContent = `解密图片: ${origW} \u00D7 ${origH} | 参数: ${paramStr}`;
    
    showProgress('left', false);
    showToast('解密完成！可点击"保存解密图"下载', 'success');
    // 移除左侧面板的disabled-panel以避免图片半透明
    document.getElementById('leftPanel').classList.remove('disabled-panel');
    
  } catch (e) {
    showProgress('left', false);
    showToast('解密失败: ' + e.message, 'error');
    console.error(e);
  }
  
  updateUI();
}

// ============================================================
// 保存图片
// ============================================================
function doSave() {
  const isDecryptMode = currentMode === 'decrypt';
  
  if (isDecryptMode && decryptedDataURL) {
    const ext = origFileExt || 'png';
    const mimeType = ext === 'jpg' ? 'image/jpeg' : ext === 'webp' ? 'image/webp' : ext === 'bmp' ? 'image/bmp' : 'image/png';
    const fileName = (origFileName || 'decrypted') + '_decrypted.' + ext;
    const link = document.createElement('a');
    link.download = fileName;
    if (decryptedCanvas && mimeType !== 'image/png') {
      link.href = decryptedCanvas.toDataURL(mimeType, 0.95);
    } else {
      link.href = decryptedDataURL;
    }
    link.click();
    showToast('解密图片已保存为 ' + ext.toUpperCase() + ' 格式', 'success');
  } else if (encryptedDataURL) {
    // 保存加密图片（始终为PNG）
    const link = document.createElement('a');
    link.download = (origFileName || 'encrypted') + '_encrypted.png';
    link.href = encryptedDataURL;
    link.click();
    showToast('加密图片已保存', 'success');
  } else {
    showToast('没有可保存的图片', 'error');
  }
}

// ============================================================
// 进度条
// ============================================================
function showProgress(side, show, pct) {
  const id = side === 'left' ? 'leftProgress' : 'rightProgress';
  const fillId = side === 'left' ? 'leftProgressFill' : 'rightProgressFill';
  document.getElementById(id).classList.toggle('hidden', !show);
  if (show) document.getElementById(fillId).style.width = pct + '%';
}

// 初始化UI
updateUI();
</script>
